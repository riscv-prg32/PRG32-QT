name: Build, test, and certify

on:
  push:
  pull_request:

jobs:
  quality:
    name: Formatting and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check C++ formatting
        run: clang-format --dry-run --Werror src/core/*.cpp src/core/*.h src/qt/*.cpp src/qt/*.h src/qt/*.mm tests/core_tests.cpp
      - name: Check documentation contracts
        run: python3 scripts/check-docs.py

  desktop:
    name: ${{ matrix.platform }} Qt build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            command: ./scripts/build-linux.sh
          - platform: Windows
            os: windows-latest
            command: pwsh -File scripts/build-windows.ps1
          - platform: macOS
            os: macos-latest
            command: ./scripts/build-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test
        shell: bash
        run: ${{ matrix.command }}

  raspberry-pi:
    name: Raspberry Pi OS compatibility (ARM64 Linux)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qt6-multimedia-dev
      - name: Build and test through the Raspberry Pi helper
        run: ./scripts/build-raspbian.sh

  ios:
    name: iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: ios
          host: mac
          modules: 'qtmultimedia'
      - name: Compile unsigned simulator application
        run: IOS_DESTINATION='generic/platform=iOS Simulator' IOS_ARCHS=arm64 ./scripts/build-ios.sh

  android:
    name: Android ARM64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: 'qtmultimedia'
      - name: Build Android package
        run: QT_ROOT="$Qt6_DIR/../.." QT_HOST_PATH="$IQTA_TOOLS/Qt/6.8.3/gcc_64" ./scripts/build-android.sh

  store-certification:
    name: Cartridge Store certification
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build portable runner
        run: cmake -S . -B build-core -DPRG32QT_BUILD_APP=OFF && cmake --build build-core
      - name: Certify current catalog
        run: python3 scripts/store-smoke.py --runner ./build-core/prg32qt-headless --frames 300 | tee store-certification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartridge-store-certification
          path: store-certification.txt
