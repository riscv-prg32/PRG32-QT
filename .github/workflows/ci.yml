name: Build, test, and certify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable core and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake -S . -B build-core -G Ninja -DPRG32QT_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-core --parallel
      - name: Test
        run: ctest --test-dir build-core --output-on-failure
      - name: Upload headless runner
        uses: actions/upload-artifact@v7
        with:
          name: prg32qt-headless-linux-x86_64
          path: build-core/prg32qt-headless
          if-no-files-found: error

  quality:
    name: Formatting and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install quality tools
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check C++ formatting
        run: clang-format --dry-run --Werror src/core/*.cpp src/core/*.h src/qt/*.cpp src/qt/*.h src/qt/*.mm tests/core_tests.cpp
      - name: Check documentation contracts
        run: python3 scripts/check-docs.py
      - name: Check Store certification parser
        run: python3 -m unittest discover -s tests -p 'store_smoke_tests.py'

  desktop:
    name: ${{ matrix.platform }} Qt build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            command: pwsh -File scripts/build-windows.ps1
          - platform: macOS
            # Qt 6.8.3 links AGL, which is absent from the Xcode 26 SDK on macos-latest.
            os: macos-15
            command: ./scripts/build-macos.sh
          - platform: macOS-Intel
            os: macos-15-intel
            command: ./scripts/build-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Windows'
        with:
          version: '6.8.3'
          arch: 'win64_mingw'
          modules: 'qtmultimedia qtwebsockets'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Windows'
        with:
          version: '6.8.3'
          modules: 'qtmultimedia qtwebsockets'
      - name: Build and test
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.command }}
      - name: Build and test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildOutput = & pwsh -NoProfile -File scripts/build-windows.ps1 2>&1
          $buildStatus = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildStatus -ne 0) {
            $diagnostics = $buildOutput | Where-Object {
              $_ -match 'undefined reference|collect2:|ld\.exe:|error:' -and $_ -notmatch '^FAILED:'
            } | Select-Object -Last 20
            if (-not $diagnostics) {
              $diagnostics = $buildOutput | Select-Object -Last 15
            }
            $details = (($diagnostics | Out-String) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
            Write-Host "::error title=Windows build failed::$details"
            exit $buildStatus
          }
      - name: Stage Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-windows-deploy | Out-Null
          cmake --install build-windows --prefix build-windows-install
          $builtExecutable = (Resolve-Path build-windows-install/PRG32.exe).Path
          $stagedExecutable = Join-Path (Resolve-Path build-windows-deploy).Path 'PRG32.exe'
          Copy-Item -LiteralPath $builtExecutable -Destination $stagedExecutable -Force
          if (-not (Test-Path $stagedExecutable -PathType Leaf)) {
            throw 'The PRG32 Windows executable could not be staged'
          }
      - name: Run Windows Qt deployment helper
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $qmlDirectory = (Resolve-Path qml).Path
          $executable = (Resolve-Path build-windows-deploy/PRG32.exe).Path
          $deployTool = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
          & $deployTool --release --qmldir $qmlDirectory $executable
      - name: Stage complete Windows Qt runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem (Join-Path $env:QT_ROOT_DIR 'bin') -Filter '*.dll' |
            Copy-Item -Destination 'build-windows-deploy' -Force
          Copy-Item (Join-Path $env:QT_ROOT_DIR 'plugins\*') 'build-windows-deploy' -Recurse -Force
          Copy-Item (Join-Path $env:QT_ROOT_DIR 'qml') 'build-windows-deploy/qml' -Recurse -Force
      - name: Validate Windows Qt dependency deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $requiredPaths = @(
            'PRG32.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Multimedia.dll',
            'Qt6Network.dll',
            'Qt6Qml.dll',
            'Qt6Quick.dll',
            'Qt6WebSockets.dll',
            'platforms\qwindows.dll'
          )
          $requiredDirectories = @(
            'qml\QtQml',
            'qml\QtQuick',
            'qml\QtQuick\Controls',
            'qml\QtQuick\Controls\Fusion',
            'qml\QtQuick\Dialogs',
            'qml\QtQuick\Layouts',
            'qml\QtQuick\Window'
          )
          foreach ($requiredPath in $requiredPaths) {
            $deployedPath = Join-Path 'build-windows-deploy' $requiredPath
            if (-not (Test-Path $deployedPath)) {
              Write-Host "::error title=Windows deployment incomplete::$requiredPath is missing"
              exit 1
            }
          }
          foreach ($requiredDirectory in $requiredDirectories) {
            $deployedDirectory = Join-Path 'build-windows-deploy' $requiredDirectory
            if (-not (Test-Path $deployedDirectory -PathType Container)) {
              Write-Host "::error title=Windows deployment incomplete::$requiredDirectory is missing"
              exit 1
            }
          }
      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          name: prg32qt-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            build-windows/PRG32*
            build-macos/PRG32.app
          if-no-files-found: error

  linux:
    name: Linux Qt build
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Qt and build tools
        run: apt-get update && apt-get install -y ca-certificates git cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-websockets-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and test
        run: ./scripts/build-linux.sh
      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: prg32qt-Linux-${{ runner.arch }}
          path: build-linux/PRG32
          if-no-files-found: error

  raspberry-pi:
    name: Raspberry Pi OS compatibility (ARM64 Linux)
    runs-on: ubuntu-24.04-arm
    # Ubuntu 24.04 supplies Qt 6.4.2, below the application's Qt 6.5 minimum.
    # Debian Trixie supplies a compatible Qt 6 kit on the same ARM64 runner.
    container: debian:trixie
    steps:
      - name: Install Qt and build tools
        run: apt-get update && apt-get install -y ca-certificates git cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-websockets-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Report Qt version
        run: pkg-config --modversion Qt6Core
      - name: Build and test through the Raspberry Pi helper
        run: ./scripts/build-raspbian.sh

  ios:
    name: iOS compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: ios
          host: mac
          modules: 'qtmultimedia qtwebsockets'
      - name: Compile unsigned simulator application
        run: QT_ROOT="$QT_ROOT_DIR" QT_HOST_ROOT="$QT_HOST_PATH" IOS_DESTINATION='generic/platform=iOS Simulator' IOS_ARCHS=x86_64 ./scripts/build-ios.sh

  tvos:
    name: Apple TV compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/prg32-qt-tvos/install
          key: qt-6.8.3-tvos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/qt-6.8.3-tvos.patch', 'scripts/build-qt-tvos.sh') }}
      - name: Build Qt tvOS simulator kit
        run: QT_HOST_ROOT="$QT_ROOT_DIR" QT_TVOS_WORK_DIR="$RUNNER_TEMP/prg32-qt-tvos" ./scripts/build-qt-tvos.sh
      - name: Compile Apple TV simulator application
        env:
          QT_ROOT: ${{ runner.temp }}/prg32-qt-tvos/install
          TVOS_DESTINATION: generic/platform=tvOS Simulator
          TVOS_ARCHS: arm64
        run: QT_HOST_ROOT="$QT_ROOT_DIR" ./scripts/build-tvos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: prg32qt-Apple-TV-Simulator-${{ runner.arch }}
          path: build-tvos-sim/Release-appletvsimulator/PRG32.app
          if-no-files-found: error

  android:
    name: Android ARM64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: 'qtmultimedia qtwebsockets'
      - name: Build Android package
        run: QT_ROOT="$QT_ROOT_DIR" QT_HOST_PATH="${QT_HOST_PATH:-${QT_ROOT_DIR%/*}/gcc_64}" ./scripts/build-android.sh

  android-tv:
    name: Android TV ARM64 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: 'qtmultimedia qtwebsockets'
      - name: Build Android TV package
        run: QT_ROOT="$QT_ROOT_DIR" QT_HOST_PATH="${QT_HOST_PATH:-${QT_ROOT_DIR%/*}/gcc_64}" ./scripts/build-android-tv.sh

  store-certification:
    name: Cartridge Store certification
    runs-on: ubuntu-latest
    needs: [quality, portable]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build portable runner
        run: cmake -S . -B build-core -DPRG32QT_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release && cmake --build build-core --parallel
      - name: Certify current catalog
        run: |
          set -o pipefail
          python3 scripts/store-smoke.py --runner ./build-core/prg32qt-headless --frames 900 2>&1 | tee store-certification-accurate.txt
          python3 scripts/store-smoke.py --runner ./build-core/prg32qt-headless --frames 900 --unlimited 2>&1 | tee store-certification-unlimited.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cartridge-store-certification
          path: store-certification-*.txt
          if-no-files-found: error
