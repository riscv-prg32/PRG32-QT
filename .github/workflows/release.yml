name: Publish release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  source:
    name: Validate and package source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate tag and derived project version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          cmake -S . -B build-version -DPRG32QT_BUILD_APP=OFF -DPRG32QT_BUILD_TESTS=OFF
          project_version="$(tr -d '\r\n' < build-version/prg32qt-version.txt)"
          if [[ "v$project_version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match Git-derived project version v$project_version" >&2
            exit 1
          fi
      - name: Run portable release tests
        run: |
          cmake -S . -B build-release -DPRG32QT_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure
      - name: Create source archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="PRG32-QT-${RELEASE_TAG#v}"
          git archive --format=tar --prefix="$prefix/" "$RELEASE_TAG" | gzip -9 > "dist/$prefix-source.tar.gz"
          git archive --format=zip --prefix="$prefix/" "$RELEASE_TAG" > "dist/$prefix-source.zip"
          cd dist
          sha256sum "$prefix-source.tar.gz" "$prefix-source.zip" > SHA256SUMS-source.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error

  desktop:
    name: Package ${{ matrix.platform }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            command: pwsh -File scripts/build-windows.ps1
          - platform: macOS
            os: macos-15
            command: ./scripts/build-macos.sh
          - platform: macOS-Intel
            os: macos-15-intel
            command: ./scripts/build-macos.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia qtwebsockets'
      - name: Build and test
        shell: bash
        run: ${{ matrix.command }}
      - name: Package macOS application as DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          macdeployqt build-macos/PRG32.app -qmldir=qml -dmg
          mv build-macos/PRG32.dmg "dist/PRG32-QT-${RELEASE_TAG#v}-${{ matrix.platform }}-${{ runner.arch }}.dmg"
      - name: Package Windows application with Qt runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item build-windows/PRG32.exe dist/package/
          windeployqt --release --qmldir qml dist/package/PRG32.exe
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          Get-Command makensis.exe
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          makensis.exe /V4 "/DVERSION=$version" "/DSOURCE=$((Resolve-Path dist/package).Path)" "/DOUTPUT=$((Resolve-Path dist).Path)\PRG32-QT-$version-Windows-${{ runner.arch }}-Setup.exe" platform/windows/installer.nsi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Package Linux
    needs: source
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install Qt and build tools
        run: apt-get update && apt-get install -y ca-certificates git cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-websockets-dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Build and test
        run: ./scripts/build-linux.sh
      - name: Package application
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          root="dist/pkg/usr/bin"
          mkdir -p "$root" dist/pkg/DEBIAN
          install -m 0755 build-linux/PRG32 "$root/PRG32"
          printf 'Package: prg32-qt\nVersion: %s\nArchitecture: amd64\nMaintainer: PRG32-QT contributors\nDepends: qml6-module-qtquick, qml6-module-qtquick-controls, qml6-module-qtquick-dialogs, libqt6multimedia6, libqt6websockets6\nDescription: Portable PRG32 cartridge runtime\n' "$version" > dist/pkg/DEBIAN/control
          dpkg-deb --build --root-owner-group dist/pkg "dist/PRG32-QT-$version-Linux-${{ runner.arch }}.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: release-Linux-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  raspberry-pi:
    name: Package Raspberry Pi OS compatibility build
    needs: source
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install Qt and build tools
        run: apt-get update && apt-get install -y ca-certificates git cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-websockets-dev
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Build and test
        run: ./scripts/build-raspbian.sh
      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          root="dist/pkg/usr/bin"
          mkdir -p "$root" dist/pkg/DEBIAN
          install -m 0755 build-raspbian/PRG32 "$root/PRG32"
          printf 'Package: prg32-qt\nVersion: %s\nArchitecture: arm64\nMaintainer: PRG32-QT contributors\nDepends: qml6-module-qtquick, qml6-module-qtquick-controls, qml6-module-qtquick-dialogs, libqt6multimedia6, libqt6websockets6\nDescription: Portable PRG32 cartridge runtime\n' "$version" > dist/pkg/DEBIAN/control
          dpkg-deb --build --root-owner-group dist/pkg "dist/PRG32-QT-$version-Raspberry-Pi-OS-ARM64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: release-Raspberry-Pi-OS-ARM64
          path: dist/*
          if-no-files-found: error

  ios:
    name: Package iOS simulator build
    needs: source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: ios
          host: mac
          modules: 'qtmultimedia qtwebsockets'
      - name: Build unsigned simulator application
        run: QT_ROOT="$QT_ROOT_DIR" QT_HOST_ROOT="$QT_HOST_PATH" IOS_DESTINATION='generic/platform=iOS Simulator' IOS_ARCHS=x86_64 ./scripts/build-ios.sh
      - name: Package application
        run: |
          mkdir -p dist
          cmake -E tar cf "dist/PRG32-QT-${RELEASE_TAG#v}-iOS-Simulator-x86_64.zip" --format=zip -- build-ios-sim/Release-iphonesimulator/PRG32.app
      - uses: actions/upload-artifact@v7
        with:
          name: release-iOS-Simulator-x86_64
          path: dist/*
          if-no-files-found: error

  tvos:
    name: Package Apple TV build
    needs: source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtshadertools'
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/prg32-qt-tvos/install
          key: qt-6.8.3-tvos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/qt-6.8.3-tvos.patch', 'scripts/build-qt-tvos.sh') }}
      - name: Build Qt tvOS simulator kit
        run: QT_HOST_ROOT="$QT_ROOT_DIR" QT_TVOS_WORK_DIR="$RUNNER_TEMP/prg32-qt-tvos" ./scripts/build-qt-tvos.sh
      - name: Compile Apple TV simulator application
        env:
          QT_ROOT: ${{ runner.temp }}/prg32-qt-tvos/install
          TVOS_DESTINATION: generic/platform=tvOS Simulator
          TVOS_ARCHS: arm64
        run: QT_HOST_ROOT="$QT_ROOT_DIR" ./scripts/build-tvos.sh
      - name: Package application
        run: |
          mkdir -p dist
          cmake -E tar cf "dist/PRG32-QT-${RELEASE_TAG#v}-Apple-TV-Simulator-arm64.zip" --format=zip -- build-tvos-sim/Release-appletvsimulator/PRG32.app
      - uses: actions/upload-artifact@v7
        with:
          name: release-Apple-TV
          path: dist/*
          if-no-files-found: error

  android:
    name: Package ${{ matrix.platform }} ARM64
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            script: ./scripts/build-android.sh
            build_dir: build-android
          - platform: Android-TV
            script: ./scripts/build-android-tv.sh
            build_dir: build-android-tv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: 'qtmultimedia qtwebsockets'
      - name: Build package
        run: QT_ROOT="$QT_ROOT_DIR" QT_HOST_PATH="${QT_HOST_PATH:-${QT_ROOT_DIR%/*}/gcc_64}" ${{ matrix.script }}
      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find '${{ matrix.build_dir }}/android-build/build/outputs/apk' -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "dist/PRG32-QT-${RELEASE_TAG#v}-${{ matrix.platform }}-ARM64.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-ARM64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [source, desktop, linux, raspberry-pi, ios, tvos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums for platform assets
        working-directory: release-assets
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name 'PRG32-QT-*' | wc -l)" -eq 11
          sha256sum PRG32-QT-* > SHA256SUMS-platforms.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
